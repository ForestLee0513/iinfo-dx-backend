name: Fast-forward dev on main push

on:
  push:
    branches:
      - main

jobs:
  updateDevelopment:
    name: Fast-forward development to main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward development to main
        run: |
          git fetch origin main
          git push origin refs/remotes/origin/main:refs/heads/development
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"deploy-development"}'

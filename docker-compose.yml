services:
  api:
    container_name: iinfo-dx-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 컨테이너 안에서는 redis 서비스 호스트명 사용 (.env 값보다 우선)
      REDIS_URL: redis://redis:6379/0
    volumes:
      # 로컬 코드 변경이 컨테이너에 즉시 반영됨 (--reload와 함께 개발용)
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    container_name: iinfo-dx-redis
    image: redis:7-alpine
    # AOF 영속화 — 호스트 재부팅 후에도 작업 상태/스케줄 오버라이드 유지
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
